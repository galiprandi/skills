# SkillSpector CI - Security scan for AI agent skills under browser-automation/
#
# Hard gate: blocks PRs with HIGH/CRITICAL SkillSpector findings in CHANGED
# files, minus documented false positives in skillspector-allow.yml.
#
# Design decisions:
# - Only findings in files CHANGED by the PR are evaluated. Pre-existing
#   findings were reviewed when those files were originally merged.
# - An allowlist (.github/skillspector-allow.yml) suppresses known false
#   positives scoped to specific files. Browser automation legitimately
#   uses network, env vars, state persistence, and token extraction —
#   patterns that trigger SkillSpector but are benign for this skill.
# - SkillSpector is pinned to a specific commit for reproducibility and
#   supply-chain safety.
# - SARIF is uploaded to GitHub Code Scanning regardless of gate result
#   so all findings (including suppressed) are visible in the Security tab.

name: SkillSpector

on:
  pull_request:
    paths:
      - "browser-automation/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: skillspector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skillspector-scan:
    name: Scan browser-automation skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SkillSpector
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/NVIDIA/skillspector.git
          skillspector --version

      - name: Get changed files
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'browser-automation/**')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed files under browser-automation/:"
          echo "$CHANGED"

      - name: Run SkillSpector (SARIF report)
        continue-on-error: true
        run: |
          skillspector scan browser-automation/ \
            --no-llm \
            --format sarif \
            --output skillspector-results.sarif

      - name: Run SkillSpector (JSON report)
        continue-on-error: true
        run: |
          skillspector scan browser-automation/ \
            --no-llm \
            --format json \
            --output skillspector-results.json

      - name: Gate on HIGH/CRITICAL findings in changed files (with allowlist)
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          # --- Load and parse the allowlist ---
          allowlist_path = Path(".github/skillspector-allow.yml")
          # Minimal YAML parser (avoid pyyaml dependency): extract suppressions list
          # Format: suppressions:\n  - rule: X\n    file: Y\n    match: Z\n    reason: ...
          suppressions = []
          if allowlist_path.exists():
              text = allowlist_path.read_text()
              in_supp = False
              current = {}
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped == "suppressions:":
                      in_supp = True
                      continue
                  if in_supp and stripped.startswith("- "):
                      if current:
                          suppressions.append(current)
                      current = {}
                      continue
                  if in_supp and ":" in stripped and not stripped.startswith("#"):
                      key, _, val = stripped.partition(":")
                      val = val.strip().strip('"').strip("'")
                      if val:
                          current[key.strip()] = val
                      elif key.strip() == "reason" and not val:
                          # Multi-line reason starts here; capture next indented lines
                          current[key.strip()] = ""
              if current:
                  suppressions.append(current)

          print(f"Loaded {len(suppressions)} suppression(s) from allowlist.")
          for s in suppressions:
              match_str = s.get('match', '')
              match_display = (' matching "%s"' % match_str) if match_str else ''
              print('  - %s in %s%s' % (s.get('rule', '?'), s.get('file', '?'), match_display))

          def is_suppressed(issue):
              """Check if a finding matches any allowlist entry."""
              loc = issue.get("location", {}) or {}
              file = loc.get("file", "")
              rule = issue.get("id", "") or issue.get("pattern", "") or ""
              msg = (issue.get("explanation") or issue.get("finding") or
                     issue.get("pattern") or "")
              for s in suppressions:
                  if s.get("rule", "").upper() != rule.upper():
                      continue
                  if s.get("file", "") != file:
                      continue
                  match = s.get("match", "")
                  if match and match.lower() not in msg.lower():
                      continue
                  return True, s.get("reason", "")
              return False, ""

          # --- Load the JSON report ---
          report_path = Path("skillspector-results.json")
          if not report_path.exists():
            print("::error::SkillSpector JSON report not found; failing closed.")
            sys.exit(1)

          try:
            report = json.loads(report_path.read_text())
          except json.JSONDecodeError as exc:
            print(f"::error::Could not parse SkillSpector JSON report: {exc}")
            sys.exit(1)

          # --- Normalize changed files (strip browser-automation/ prefix) ---
          changed_raw = set(
            f.strip() for f in os.environ.get("CHANGED_FILES", "").splitlines() if f.strip()
          )
          if not changed_raw:
            print("No files changed under browser-automation/; nothing to gate.")
            sys.exit(0)

          SCAN_PREFIX = "browser-automation/"
          changed = set()
          for f in changed_raw:
            if f.startswith(SCAN_PREFIX):
              changed.add(f[len(SCAN_PREFIX):])
            else:
              changed.add(f)

          print(f"\nPR changed {len(changed)} file(s) (normalized to scan dir):")
          for f in sorted(changed):
            print(f"  {f}")

          # --- Classify findings ---
          issues = report.get("issues", []) or []
          blocking = {"HIGH", "CRITICAL"}

          def get_file(issue):
            loc = issue.get("location", {}) or {}
            return loc.get("file", "")

          def get_sev(issue):
            return (issue.get("severity") or "").upper()

          def describe(issue):
            return (issue.get("explanation")
                    or issue.get("finding")
                    or issue.get("pattern")
                    or "")

          changed_issues = [i for i in issues if get_file(i) in changed]
          preexisting_issues = [i for i in issues if get_file(i) not in changed]

          # Split changed findings: suppressed vs blocking vs non-blocking
          changed_blocking = []
          changed_suppressed = []
          changed_medlow = []
          for i in changed_issues:
            sev = get_sev(i)
            supp, reason = is_suppressed(i)
            if supp:
              changed_suppressed.append((i, reason))
            elif sev in blocking:
              changed_blocking.append(i)
            elif sev in {"MEDIUM", "LOW"}:
              changed_medlow.append(i)

          preexisting_high = [i for i in preexisting_issues if get_sev(i) in blocking]

          print(f"\nFindings in CHANGED files:")
          print(f"  Blocking (HIGH/CRITICAL, not allowlisted): {len(changed_blocking)}")
          print(f"  Suppressed (in allowlist): {len(changed_suppressed)}")
          print(f"  Non-blocking (MEDIUM/LOW): {len(changed_medlow)}")
          print(f"Findings in pre-existing files: {len(preexisting_issues)} "
                f"({len(preexisting_high)} HIGH/CRITICAL) — not evaluated")

          # Report blocking findings as errors
          for issue in changed_blocking:
            loc = issue.get("location", {}) or {}
            file = loc.get("file", "<unknown>")
            line = loc.get("start_line", "?")
            print(f"::error file={file},line={line}::"
                  f"{issue.get('severity')} {issue.get('id', '?')} - {issue.get('category', '')}: "
                  f"{describe(issue)}")

          # Report suppressed findings as notices (for audit trail)
          for issue, reason in changed_suppressed:
            loc = issue.get("location", {}) or {}
            file = loc.get("file", "<unknown>")
            line = loc.get("start_line", "?")
            print(f"::notice file={file},line={line}::"
                  f"SUPPRESSED {issue.get('severity')} {issue.get('id', '?')} - "
                  f"{issue.get('category', '')}: {describe(issue)} "
                  f"[Allowlisted: {reason[:80]}...]")

          # Report non-blocking findings as warnings
          for issue in changed_medlow:
            loc = issue.get("location", {}) or {}
            file = loc.get("file", "<unknown>")
            line = loc.get("start_line", "?")
            print(f"::warning file={file},line={line}::"
                  f"{issue.get('severity')} {issue.get('id', '?')} - {issue.get('category', '')}: "
                  f"{describe(issue)}")

          # Report pre-existing HIGH as notices (context only)
          for issue in preexisting_high:
            loc = issue.get("location", {}) or {}
            file = loc.get("file", "<unknown>")
            line = loc.get("start_line", "?")
            print(f"::notice file={file},line={line}::"
                  f"PRE-EXISTING {issue.get('severity')} {issue.get('id', '?')} - "
                  f"{issue.get('category', '')}: {describe(issue)}")

          # --- Gate ---
          if changed_blocking:
            print(f"\n::error::Failing PR: {len(changed_blocking)} HIGH/CRITICAL finding(s) "
                  f"in changed files (not in allowlist).")
            sys.exit(1)

          print(f"\nNo blocking findings in changed files; PR is allowed to proceed.")
          if changed_suppressed:
            print(f"Note: {len(changed_suppressed)} finding(s) were suppressed by the allowlist.")
          if preexisting_high:
            print(f"Note: {len(preexisting_high)} HIGH/CRITICAL finding(s) in pre-existing files "
                  f"were reported as notices but do not block this PR.")
          sys.exit(0)
          PY

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillspector-results.sarif
          category: skillspector
