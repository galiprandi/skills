# SkillSpector CI - Security scan for AI agent skills under browser-automation/
#
# Runs SkillSpector (https://github.com/NVIDIA/SkillSpector) on every pull
# request that modifies files under `browser-automation/`. Results are emitted
# as SARIF and uploaded to GitHub Code Scanning. The PR is blocked only when
# HIGH or CRITICAL severity findings are detected in files CHANGED by the PR;
# findings in pre-existing files are reported but do not block, since those
# were already reviewed when they were originally merged.

name: SkillSpector

on:
  pull_request:
    paths:
      - "browser-automation/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: skillspector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skillspector-scan:
    name: Scan browser-automation skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SkillSpector
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/NVIDIA/skillspector.git
          skillspector --version

      - name: Get changed files
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'browser-automation/**')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed files under browser-automation/:"
          echo "$CHANGED"

      - name: Run SkillSpector (SARIF report)
        continue-on-error: true
        run: |
          skillspector scan browser-automation/ \
            --no-llm \
            --format sarif \
            --output skillspector-results.sarif

      - name: Run SkillSpector (JSON report)
        continue-on-error: true
        run: |
          skillspector scan browser-automation/ \
            --no-llm \
            --format json \
            --output skillspector-results.json

      - name: Fail on HIGH/CRITICAL findings in changed files
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report_path = Path("skillspector-results.json")
          if not report_path.exists():
            print("::error::SkillSpector JSON report not found; failing closed.")
            sys.exit(1)

          try:
            report = json.loads(report_path.read_text())
          except json.JSONDecodeError as exc:
            print(f"::error::Could not parse SkillSpector JSON report: {exc}")
            sys.exit(1)

          changed = set(
            f.strip() for f in os.environ.get("CHANGED_FILES", "").splitlines() if f.strip()
          )
          if not changed:
            print("No files changed under browser-automation/; nothing to gate.")
            sys.exit(0)

          # SkillSpector reports paths relative to the scanned directory
          # (e.g. "sites/foo.md"), but git diff reports paths relative to the
          # repo root (e.g. "browser-automation/sites/foo.md"). Normalize by
          # stripping the "browser-automation/" prefix from changed files so
          # they match SkillSpector's reported paths.
          SCAN_PREFIX = "browser-automation/"
          changed_normalized = set()
          for f in changed:
            if f.startswith(SCAN_PREFIX):
              changed_normalized.add(f[len(SCAN_PREFIX):])
            else:
              changed_normalized.add(f)
          changed = changed_normalized

          print(f"PR changed {len(changed)} file(s) under browser-automation/:")
          for f in sorted(changed):
            print(f"  {f}")

          issues = report.get("issues", []) or []
          blocking = {"HIGH", "CRITICAL"}

          def get_file(issue):
            loc = issue.get("location", {}) or {}
            return loc.get("file", "")

          changed_issues = [i for i in issues if get_file(i) in changed]
          preexisting_issues = [i for i in issues if get_file(i) not in changed]

          changed_high = [i for i in changed_issues if (i.get("severity") or "").upper() in blocking]
          changed_medlow = [i for i in changed_issues if (i.get("severity") or "").upper() in {"MEDIUM", "LOW"}]
          preexisting_high = [i for i in preexisting_issues if (i.get("severity") or "").upper() in blocking]

          print(f"\nFindings in CHANGED files: {len(changed_issues)} "
                f"({len(changed_high)} HIGH/CRITICAL, {len(changed_medlow)} MEDIUM/LOW)")
          print(f"Findings in pre-existing files: {len(preexisting_issues)} "
                f"({len(preexisting_high)} HIGH/CRITICAL) — reported but not blocking")

          def describe(issue):
            return (issue.get("explanation")
                    or issue.get("finding")
                    or issue.get("pattern")
                    or "")

          for issue in changed_high:
            loc = issue.get("location", {}) or {}
            file = loc.get("file", "<unknown>")
            line = loc.get("start_line", "?")
            print(f"::error file={file},line={line}::"
                  f"{issue.get('severity')} {issue.get('id', '?')} - {issue.get('category', '')}: "
                  f"{describe(issue)}")

          for issue in changed_medlow:
            loc = issue.get("location", {}) or {}
            file = loc.get("file", "<unknown>")
            line = loc.get("start_line", "?")
            print(f"::warning file={file},line={line}::"
                  f"{issue.get('severity')} {issue.get('id', '?')} - {issue.get('category', '')}: "
                  f"{describe(issue)}")

          for issue in preexisting_high:
            loc = issue.get("location", {}) or {}
            file = loc.get("file", "<unknown>")
            line = loc.get("start_line", "?")
            print(f"::notice file={file},line={line}::"
                  f"PRE-EXISTING {issue.get('severity')} {issue.get('id', '?')} - {issue.get('category', '')}: "
                  f"{describe(issue)}")

          if changed_high:
            print(f"\n::error::Failing PR: {len(changed_high)} HIGH/CRITICAL finding(s) in changed files.")
            sys.exit(1)

          print(f"\nNo HIGH/CRITICAL findings in changed files; PR is allowed to proceed.")
          if preexisting_high:
            print(f"Note: {len(preexisting_high)} HIGH/CRITICAL finding(s) in pre-existing files "
                  f"were reported as notices but do not block this PR.")
          sys.exit(0)
          PY

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillspector-results.sarif
          category: skillspector
