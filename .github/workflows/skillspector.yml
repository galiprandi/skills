# SkillSpector CI - Security scan for AI agent skills under browser-automation/
#
# Runs SkillSpector (https://github.com/NVIDIA/SkillSpector) on every pull
# request that modifies files under `browser-automation/`. Results are emitted
# as SARIF and uploaded to GitHub Code Scanning. The PR is blocked only when
# HIGH or CRITICAL severity findings are detected; MEDIUM/LOW findings are
# reported but do not fail the check.
#
# SkillSpector docs (install, CLI, exit codes, output formats):
#   https://github.com/NVIDIA/SkillSpector#integrating-skillspector
#
# Notes on gating strategy:
#   SkillSpector's exit code is driven by the aggregate risk *score band*
#   (0 = SAFE/CAUTION, 1 = DO_NOT_INSTALL, 2 = error). A single HIGH finding
#   only adds 25 points, which can still land in the CAUTION band (exit 0),
#   so the exit code alone is NOT a reliable per-finding severity gate.
#   There is no built-in `--fail-on-severity` flag, so we parse the JSON
#   report's `issues[].severity` field and fail the job only when a HIGH or
#   CRITICAL finding is present.

name: SkillSpector

on:
  pull_request:
    paths:
      - "browser-automation/**"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions required to upload SARIF results to GitHub Code Scanning.
permissions:
  contents: read
  security-events: write

# Prevent concurrent runs of the same PR from racing; cancel superseded runs.
concurrency:
  group: skillspector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skillspector-scan:
    name: Scan browser-automation skills
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # 1. Check out the repository (full history not required for a scan).
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 2. Set up Python 3.12 (SkillSpector requires Python 3.12+).
      # ---------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------------
      # 3. Install SkillSpector.
      #
      #    SkillSpector is not published to PyPI; the documented install is
      #    `uv tool install git+https://github.com/NVIDIA/skillspector.git`.
      #    The pip equivalent (used here) installs directly from the git repo.
      # ---------------------------------------------------------------------
      - name: Install SkillSpector
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/NVIDIA/skillspector.git
          skillspector --version

      # ---------------------------------------------------------------------
      # 4. Run the scan and produce a SARIF report for GitHub Code Scanning.
      #
      #    `--no-llm` keeps the scan static-only so it runs in CI without any
      #    LLM provider credentials. The SARIF file is uploaded in a later
      #    step regardless of whether this step finds issues, so we use
      #    `continue-on-error` here and let the dedicated gate step below
      #    decide whether to fail the PR.
      # ---------------------------------------------------------------------
      - name: Run SkillSpector (SARIF report)
        continue-on-error: true
        run: |
          skillspector scan browser-automation/ \
            --no-llm \
            --format sarif \
            --output skillspector-results.sarif

      # ---------------------------------------------------------------------
      # 5. Run the scan again and produce a JSON report for severity gating.
      #
      #    We generate JSON separately because its `issues[].severity` field
      #    gives an explicit per-finding severity (LOW | MEDIUM | HIGH |
      #    CRITICAL), which is more reliable for gating than the SARIF level
      #    mapping or the aggregate exit code. The scan is static (--no-llm)
      #    so running it twice is cheap.
      # ---------------------------------------------------------------------
      - name: Run SkillSpector (JSON report)
        continue-on-error: true
        run: |
          skillspector scan browser-automation/ \
            --no-llm \
            --format json \
            --output skillspector-results.json

      # ---------------------------------------------------------------------
      # 6. Gate: fail the PR only on HIGH or CRITICAL findings.
      #
      #    Parses the JSON report and inspects every finding's `severity`
      #    field. If any HIGH or CRITICAL finding is present, the step exits
      #    with code 1 and fails the job. MEDIUM and LOW findings are printed
      #    for visibility but do not block the PR. If the JSON report is
      #    missing (e.g. the scan errored), we fail closed to avoid silently
      #    passing a broken scan.
      # ---------------------------------------------------------------------
      - name: Fail on HIGH or CRITICAL findings
        run: |
          python3 <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path("skillspector-results.json")
          if not report_path.exists():
              print("::error::SkillSpector JSON report not found; failing closed.")
              sys.exit(1)

          try:
              report = json.loads(report_path.read_text())
          except json.JSONDecodeError as exc:
              print(f"::error::Could not parse SkillSpector JSON report: {exc}")
              sys.exit(1)

          issues = report.get("issues", []) or []
          blocking = {"HIGH", "CRITICAL"}

          high_or_critical = [i for i in issues if (i.get("severity") or "").upper() in blocking]
          medium_or_low = [i for i in issues if (i.get("severity") or "").upper() in {"MEDIUM", "LOW"}]

          print(f"SkillSpector reported {len(issues)} finding(s): "
                f"{len(high_or_critical)} HIGH/CRITICAL, {len(medium_or_low)} MEDIUM/LOW.")

          # Per-finding dict shape (from Finding.to_dict() in models.py):
          #   id, finding_id, category, pattern, severity, confidence,
          #   location{file,start_line,end_line}, finding, explanation,
          #   remediation, code_snippet, intent, tags
          def describe(issue):
              return (issue.get("explanation")
                      or issue.get("finding")
                      or issue.get("pattern")
                      or "")

          for issue in high_or_critical:
              loc = issue.get("location", {}) or {}
              file = loc.get("file", "<unknown>")
              line = loc.get("start_line", "?")
              print(f"::error file={file},line={line}::"
                    f"{issue.get('severity')} {issue.get('id', '?')} - {issue.get('category', '')}: "
                    f"{describe(issue)}")

          for issue in medium_or_low:
              loc = issue.get("location", {}) or {}
              file = loc.get("file", "<unknown>")
              line = loc.get("start_line", "?")
              print(f"::warning file={file},line={line}::"
                    f"{issue.get('severity')} {issue.get('id', '?')} - {issue.get('category', '')}: "
                    f"{describe(issue)}")

          if high_or_critical:
              print(f"::error::Failing PR: {len(high_or_critical)} HIGH/CRITICAL finding(s) detected.")
              sys.exit(1)

          print("No HIGH/CRITICAL findings; PR is allowed to proceed.")
          sys.exit(0)
          PY

      # ---------------------------------------------------------------------
      # 7. Upload SARIF results to GitHub Code Scanning.
      #
      #    `if: always()` ensures results are uploaded even when the gate
      #    step above fails, so findings are visible in the PR Security tab.
      # ---------------------------------------------------------------------
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillspector-results.sarif
          category: skillspector
